# ================================================================
# render.yaml — Blueprint Render (free tier) para yadinstore-jenkins-obs-live
#
# Clone de yadinstore-cicd-demo/render.yaml:15-26 adaptado a
# Jenkins live. Zero dependencies: node server.js
#
# Deploy:
#   1. Push repo a GitHub (yadinstore-jenkins-obs-live o monorepo).
#   2. Render > New > Blueprint > elegir repo.
#   3. Setear DOCKER_LIVE_TOKEN en dashboard (sync:false) y pasarlo
#      como -Token al agente: .\jenkins-obs-agent.ps1 -Token "xxx"
#
# healthCheckPath: /api/jenkins/live (público, no requiere token)
# CORS Pages-only: https://ypmanrique2.github.io (no *)
# Rate-limit: 10/min/IP en POSTs
# NOTA free tier 10m BE + 20m BE-JD laboral (2026-09-01 ACTUAL): Activo para BE-JD skills, 346.5h 46% $0 (BE 9h continuo 198h + BE-JD 20m 27/d 148.5h deja 403.5h libres)
# BE 10m L-V 08:30-17:30 Bogotá = 54 pings/día 6/h ×22=1188 pero 9h continuo 198h (gap 10m <15m sleep → 0 wake) + BE-JD 20m 27/día ×22=594×15min=148.5h →346.5h 46% $0 vs 15m/30m 297h 39% deja 453h vs 7m/15m 396h 52% deja 354h vs 1h 99h 13% deja 651h (todos $0 hasta 750h). yadinstore-cicd-demo-live
# sigue pausado (services: [] ahorra 60h). Free tier duerme tras ~15m → wake 30-60s, luego ~200ms.
# Keep-warm: .github/workflows/keep-warm.yml cron */10 * * * * + guard 510-1050 L-V + BE MIN%10==0 + BE-JD MIN%20==0 + UptimeRobot BE 10m 62.31% + BE-JD 20m 62.438% ya Up (se recupera de Down 3d, no necesita cron-job.org, keep-warm backup 10m/20m laboral)
# + cron-job.org opcional 10m/20m L-V America/Bogota si se quiere sin UptimeRobot. Ver yadinStore-Spec/avance_28-08-2026-render-1h.md + avance_28-08-2026-k8s-hibrido-min.md (10m/20m 346.5h)
# Incidente UptimeRobot Down 3d 7h 50m Started Aug 28 14:07 GMT-5 ya resuelto por BE 10m/BE-JD 20m 62% Up; ManualSync ya hecho Synced y KAFKA var no necesita reescribir salvo que se vacíe (ya está seteada, BE-KD Conectado sin URI tras fix 5c3e097). workflow_dispatch + cron re-habilita tras Manual Deploy.
# ================================================================

services:
  - type: web
    name: yadinstore-jenkins-obs-live
    runtime: node
    plan: free
    # Si este archivo vive en repo dedicado yadinstore-jenkins-obs-live,
    # rootDir no es necesario. Si vive en monorepo, descomenta:
    # rootDir: yadinstore-jenkins-obs-live
    buildCommand: ""          # zero dependencies — no build
    startCommand: node server.js
    healthCheckPath: /api/jenkins/live
    autoDeploy: true
    envVars:
      - key: DOCKER_LIVE_TOKEN
        sync: false           # token para POSTs del agente (x-live-token), GETs públicos
      - key: NODE_ENV
        value: production
