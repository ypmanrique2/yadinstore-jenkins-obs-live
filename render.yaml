# ================================================================
# render.yaml — Blueprint Render (free tier) para yadinstore-jenkins-obs-live
#
# Clone de yadinstore-cicd-demo/render.yaml:15-26 adaptado a
# Jenkins live. Zero dependencies: node server.js
#
# Deploy:
#   1. Push repo a GitHub (yadinstore-jenkins-obs-live o monorepo).
#   2. Render > New > Blueprint > elegir repo.
#   3. Setear DOCKER_LIVE_TOKEN en dashboard (sync:false) y pasarlo
#      como -Token al agente: .\jenkins-obs-agent.ps1 -Token "xxx"
#
# healthCheckPath: /api/jenkins/live (público, no requiere token)
# CORS Pages-only: https://ypmanrique2.github.io (no *)
# Rate-limit: 10/min/IP en POSTs
# NOTA free tier 1h laboral (2026-08-28): Activo para BE-JD skills, 1h laboral 13% $0
# BE+BE-JD 1h L-V 08:30-17:30 Bogotá = 9 pings/día ×22 =198 hits/mes ×15min=49.5h por servicio → 99h (13% cuota $0)
# vs 30m laboral 198h 26% $0 — 1h ahorra 99h, deja 651h libres (ambos $0). yadinstore-cicd-demo-live
# sigue pausado (services: [] ahorra 60h). Free tier duerme tras ~15m → wake 30-60s, luego ~200ms.
# Keep-warm: .github/workflows/keep-warm.yml cron 0 * * * * + guard 510-1050 + UptimeRobot 1h
# + cron-job.org 1h L-V America/Bogota. Ver yadinStore-Spec/avance_28-08-2026-render-1h.md
# ================================================================

services:
  - type: web
    name: yadinstore-jenkins-obs-live
    runtime: node
    plan: free
    # Si este archivo vive en repo dedicado yadinstore-jenkins-obs-live,
    # rootDir no es necesario. Si vive en monorepo, descomenta:
    # rootDir: yadinstore-jenkins-obs-live
    buildCommand: ""          # zero dependencies — no build
    startCommand: node server.js
    healthCheckPath: /api/jenkins/live
    autoDeploy: true
    envVars:
      - key: DOCKER_LIVE_TOKEN
        sync: false           # token para POSTs del agente (x-live-token), GETs públicos
      - key: NODE_ENV
        value: production
